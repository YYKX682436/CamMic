<h1>CamMic 安装完成</h1>
<p>安装器已重启 macOS 音频服务。打开 CamMic 确认音频组件状态；在 QuickTime 或其他录音应用中选择 <strong>CamMic</strong> 麦克风。</p>
<p>若安装未完成，已保存的 CamMic 文件位于 <code>/Library/Application Support/CamMic/Recovery/</code>，可使用随发行包提供的 <code>restore-cammic-install.sh</code> 恢复。</p>
