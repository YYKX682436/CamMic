<h1>安装 CamMic</h1>
<p>此安装包会安装 <strong>CamMic.app</strong> 和 CamMic 专用音频驱动。完成后，系统麦克风列表中会出现名称为 <strong>CamMic</strong> 的输入设备。</p>
<p>安装前请停止录音并退出音频应用。安装期间会重启 macOS 音频服务，音频会短暂中断。</p>
<p>更新时安装器会先保存 CamMic 原有应用和驱动。它只管理 CamMic 的安装路径，不会替换或卸载 BlackHole 或其他音频组件。</p>
