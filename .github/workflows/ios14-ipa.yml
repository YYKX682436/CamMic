name: Build iOS 14 IPA

on:
  push:
    branches:
      - main
      - codex/ios14-capture
      - codex/ios14-route-r1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Regress route, capture, listener-session, and callback behavior
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: |
          xcodebuild \
            -project CamMic.xcodeproj \
            -scheme CamMic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -derivedDataPath "$PWD/DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:CamMicTests/RouteChangeTests \
            -only-testing:CamMicTests/AudioCaptureQueueTests \
            -only-testing:CamMicTests/AudioLinkServerTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Run bounded protocol and session regressions
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: swift test --package-path . --scratch-path .build/phase1-2-tests
      - name: Build unsigned arm64 IPA with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-unsigned-ipa.sh
      - name: Build arm64 Mac receiver app
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-mac-app.sh
      - name: Upload iPhone IPA, Mac app, and build reports
        uses: actions/upload-artifact@v4
        with:
          name: CamMic-Phase1-2-R1-${{ github.sha }}
          path: |
            dist/CamMic-iOS14-unsigned.ipa
            dist/build-report.txt
            dist/CamMic-Mac-arm64-*.zip
            dist/mac-build-report.txt
          if-no-files-found: error
