name: Build CamMic delivery

on:
  push:
    branches:
      - main
      - codex/ios14-capture
      - codex/ios14-route-r1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Regress route, capture, listener-session, and callback behavior
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: |
          xcodebuild \
            -project CamMic.xcodeproj \
            -scheme CamMic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -derivedDataPath "$PWD/DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:CamMicTests/RouteChangeTests \
            -only-testing:CamMicTests/AudioCaptureQueueTests \
            -only-testing:CamMicTests/AudioLinkServerTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run shared protocol, audio output, and CamMic endpoint regressions
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: swift test --package-path . --scratch-path .build/phase1-step1-tests

      - name: Build the CamMic HAL driver and standalone repair installer
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-audio-driver.sh

      - name: Build the corresponding complete source archive
        run: ./scripts/build-source-bundle.sh

      - name: Build unsigned iOS 14 IPA with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-unsigned-ipa.sh

      - name: Build the renamed CamMic.app
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-mac-app.sh

      - name: Build the combined installer and macOS delivery archive
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-installer-package.sh

      - name: Upload CamMic applications, driver installers, source, and reports
        uses: actions/upload-artifact@v4
        with:
          name: CamMic-Step1-${{ github.sha }}
          path: |
            dist/CamMic-iOS14-unsigned.ipa
            dist/build-report.txt
            dist/CamMic.app/**
            dist/CamMic-Installer.pkg
            dist/CamMicAudioDriver.pkg
            dist/CamMic-macOS-arm64-*.zip
            dist/CamMic-Source-*.tar.gz
            dist/mac-build-report.txt
            dist/audio-driver-build-report.txt
            dist/installer-build-report.txt
          if-no-files-found: error
          retention-days: 30
