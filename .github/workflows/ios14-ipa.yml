name: Build CamMic delivery

on:
  push:
    branches:
      - main
      - codex/ios14-capture
      - codex/ios14-route-r1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check generated platform icons and alpha
        run: |
          ./scripts/generate-icons.sh
          git diff --exit-code -- Assets/CamMicIcon-1024.png Assets/CamMicIcon-macOS-1024.png Assets/CamMic.icns Assets/CamMicIcon.iconset Assets.xcassets/AppIcon.appiconset

      - name: Regress route, capture, listener-session, and callback behavior
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: |
          xcodebuild \
            -project CamMic.xcodeproj \
            -scheme CamMic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -derivedDataPath "$PWD/DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:CamMicTests/RouteChangeTests \
            -only-testing:CamMicTests/AudioCaptureQueueTests \
            -only-testing:CamMicTests/AudioLinkServerTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Install pinned USBMux dependency build tools
        run: brew install autoconf automake libtool pkgconf

      - name: Build LGPL USBMux libraries from pinned source for macOS 13
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-usbmuxd-dependencies.sh

      - name: Run shared protocol, audio output, CamMic endpoint, and USB connection regressions
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
          PKG_CONFIG_PATH: ${{ github.workspace }}/.build/usbmuxd-deps/prefix/lib/pkgconfig
        run: swift test --package-path . --scratch-path .build/phase2-step2-tests

      - name: Check CoreAudio installer restart and recovery behavior
        run: bash ./scripts/test-coreaudio-restart.sh

      - name: Build the CamMic HAL driver and standalone repair installer
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-audio-driver.sh

      - name: Build the corresponding complete source archive
        run: ./scripts/build-source-bundle.sh

      - name: Build unsigned iOS 14 IPA with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-unsigned-ipa.sh

      - name: Build the renamed CamMic.app
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-mac-app.sh

      - name: Build the combined installer and macOS delivery archive
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/build-installer-package.sh

      - name: Verify actual 0.3.2 release upgrade, repeat install, and CamMic-only uninstall
        run: ./scripts/test-cammic-install-lifecycle.sh "$PWD/TestFixtures/CamMic-Installer-0.3.2-902f1a9.pkg" "$PWD/dist/CamMic-Installer.pkg"

      - name: Install CamMic HAL on the runner and record known PCM through CoreAudio
        run: ./scripts/test-cammic-coreaudio-driver.sh install

      - name: Upload CamMic applications, driver installers, source, and reports
        uses: actions/upload-artifact@v4
        with:
          name: CamMic-Stage2-2-${{ github.sha }}
          path: |
            dist/CamMic-iOS14-unsigned.ipa
            dist/build-report.txt
            dist/CamMic.app/**
            dist/CamMic-Installer.pkg
            dist/CamMicAudioDriver.pkg
            dist/CamMic-macOS-arm64-*.zip
            dist/CamMic-Source-*.tar.gz
            dist/mac-build-report.txt
            dist/audio-driver-build-report.txt
            dist/installer-build-report.txt
            dist/cammic-coreaudio-validation/*.txt
            dist/cammic-coreaudio-validation/*.wav
            dist/cammic-install-lifecycle-validation/*.txt
            dist/cammic-install-lifecycle-validation/*.json
            Assets/CamMicIcon-macOS-1024.png
          if-no-files-found: error
          retention-days: 30
